# SPDX-License-Identifier: Apache-2.0
[project]
name = "sayfirst-cli"
version = "0.2.0"
description = "The product command-line interface of the sayfirst control plane"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [{ name = "fredaime", email = "frederic.aime@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# Article 13 and article 14: the client depends on the contract distribution and
# on nothing else this project publishes. The closure this line produces is what
# `scripts/check_dependency_closure.py` installs and reads, so the rule is not a
# promise made here — it is measured after an install. `sayfirst-boundary` joins
# it because a governed program holds a grant in it (article 10); it depends on
# the contract only, and it is not the server (article 14).
dependencies = ["sayfirst-contract==0.2.0", "sayfirst-boundary==0.2.0"]

# The public repository this distribution sends a reader to. It does not exist
# yet: the repository is created fresh in the act that publishes it, and these
# are the names the operator chose for that act. The guard
# `tests/test_pointers_survive_publication.py` holds them, so a rename lands
# here and there together or not at all. No licence classifier: the licence is
# declared as an expression above, and an index refuses a distribution that
# carries both.
[project.urls]
Repository = "https://github.com/fredaime/sayfirst-cli"
Documentation = "https://github.com/fredaime/sayfirst-cli/blob/main/README.md"
Changelog = "https://github.com/fredaime/sayfirst-cli/blob/main/CHANGELOG.md"

[project.scripts]
sayfirst = "sayfirst_cli.main:run"

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.12",
  "sayfirst-contract[stub]==0.2.0",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sayfirst_cli"]
# Article 9's convenience packs are data beside the code that loads them, not
# code themselves: `pack.toml` and `NOTE.md` are not Python, and a future
# exclude pattern added here for some other reason must not silently drop
# them. Named explicitly so the wheel carries every file of every pack
# directory; `scripts/check_dependency_closure.py` reads them back out of an
# environment built from the actual wheel and fails when one is missing. (The
# tests cannot prove this: the gate installs this project editable, so every
# reader they exercise resolves to the source tree.)
include = ["src/sayfirst_cli/packs/**"]

[tool.hatch.build.targets.sdist.force-include]
"LICENSE" = "LICENSE"
"NOTICE" = "NOTICE"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-rxX"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
